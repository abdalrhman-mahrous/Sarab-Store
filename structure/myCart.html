<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/myCart.css" />
    <title>SARAB</title>
  </head>
  <body>
    <header>
      <div class="nav-content">
        <div class="user-info">
          <a href="/structure/profile.html"
            ><img src="/images/batman.ico" alt="pfp"
          /></a>
          <div class="user-text">
            <p class="user-name">batman</p>

            <p class="user-id">user@6969</p>
          </div>
        </div>
        <nav>
          <ul class="nav-links">
            <li><a href="/structure/home.html">Home</a></li>
            <li><a href="/structure/myCart.html">My Cart</a></li>
            <li><a href="/structure/products.html">Products</a></li>
          </ul>
        </nav>
        <div class="logo-img">
          <a href="./home.html">
            <img src="/images/Logo.png" alt="Logo" />
          </a>
        </div>
        <!--  -->
        <div class="mobile-nav">
          <i class="fa-solid fa-bars mobile-menu"></i>
        </div>
      </div>
    </header>
    <main>
      <h1>My Shopping Cart</h1>
      <div class="content-wrapper-mycart">
        <div class="item-in-cart">
          <div class="img-for-item-in-cart">
            <a href="#">
              <img src="/images/hoodie.jpg" alt="hoddie" />
            </a>
          </div>
          <div class="in-cart-item-details">
            <div class="incart-product-name">
              <p>Men's Velvet Slim Fit Full Zip Tie</p>
            </div>
            <div class="incart-product-price">
              <p>3.99$</p>
            </div>
          </div>
          <div class="counter-wrapper">
            <div class="quantity-button">
              <button>+</button>
              <span>1</span>
              <button>-</button>
            </div>
          </div>
          <div class="delete">
            <button type="button" aria-label="Remove item">
              <svg
                class="delete-icon"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <path
                  d="M4 5h16v2H4V5zm2 2h12l-1 14H7L6 7zm3-4h6l1 2H8l1-2zm0 6h2v9H9V9zm4 0h2v9h-2V9z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-container">
        <div class="quick-links">
          <p>Quick Links</p>
          <ul>
            <li><a href="/structure/home.html">Home</a></li>
            <li><a href="/structure/myCart.html">My Cart</a></li>
            <li><a href="/structure/products.html">Products</a></li>
          </ul>
        </div>
        <div class="contact-us">
          <p>Contact Us</p>
          <div class="contact-info">
            <p>mi_bombo@gmail.com</p>
            <p>+920.192.198.1.1</p>
            <p>+920.192.168.1.2</p>
          </div>
        </div>
        <div class="follow-us">
          <p>Follow Us</p>
          <div class="follow-us-icons">
            <a
              href="https://www.facebook.com"
              target="_blank"
              class="fa-brands fa-facebook fa-xl"
            ></a>
            <a
              href="https://www.instagram.com"
              target="_blank"
              class="fa-brands fa-instagram fa-xl"
            ></a>
          </div>
        </div>
      </div>
      <p>© 2025 All rights reserved - SARAB Store</p>
    </footer>
  </body>
</html>
